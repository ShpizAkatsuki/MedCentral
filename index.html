<script>try{const t=localStorage.getItem("medcentral_theme");if(t==="dark"||(!t&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.classList.add("dark")}catch(e){}</script>
<style>
:root{--bg:#F5F5F7;--cd:#fff;--fg:#1D1D1F;--mu:#F2F2F7;--mf:#6E6E73;--bd:#D2D2D7;--pr:#0071E3;--ph:#0077ED;--ok:#059669;--wn:#d97706;--dg:#dc2626;--wb:#fffbeb;--ob:#ecfdf5;--gl:rgba(255,255,255,.88);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html.dark{--bg:#0D0D0E;--cd:#1C1C1E;--fg:#f3f4f6;--mu:#2C2C2E;--mf:#9ca3af;--bd:#2C2C2E;--wb:#2a2412;--ob:#0f2a22;--gl:rgba(28,28,30,.88);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%;touch-action:pan-x pan-y}
body{font-family:Heebo,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg);transition:background-color .3s,color .3s}
button,input,select,textarea{font-family:inherit}button{cursor:pointer}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:9999px}
:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
.app{display:flex;height:100%;overflow:hidden}
.side{position:fixed;inset:0 0 0 auto;z-index:50;width:288px;max-width:88vw;background:var(--gl);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-left:1px solid var(--bd);display:flex;flex-direction:column;transform:translateX(110%);transition:transform .3s ease-in-out;box-shadow:0 20px 40px rgba(0,0,0,.2)}.side.open{transform:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.3);backdrop-filter:blur(4px);z-index:40}
.brandrow{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--bd);flex-shrink:0}
.brand{display:flex;align-items:center;gap:12px;border:0;background:none;color:inherit;text-align:right}.brand b{display:block;font-size:16px}.brand small{font-size:12px;color:var(--mf);font-weight:500}
.logo{width:36px;height:36px;border-radius:12px;background:var(--pr);color:#fff;display:grid;place-items:center;box-shadow:0 4px 10px rgba(59,130,246,.25)}
.icon{border:0;background:none;color:inherit;width:40px;height:40px;border-radius:12px;font-size:20px}.icon:hover{background:var(--mu)}
nav{flex:1;overflow:auto;padding:20px 16px}
.cap{font-size:12px;font-weight:600;color:var(--mf);padding:0 12px;margin:0 0 8px}
.nb{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;border:0;background:none;color:inherit;text-align:right;padding:10px 12px;border-radius:12px;font-size:14px;font-weight:500;margin-bottom:4px;transition:background .15s}
.nb:hover{background:var(--mu)}.nb.on{background:var(--pr);color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.1)}.nb.on .pill{background:rgba(255,255,255,.2);color:#fff}
.nb .ic{width:20px;text-align:center;margin-left:12px}.nb.s{padding:8px 12px}
.sub{margin-right:20px;padding-right:8px;border-right:1px solid var(--bd)}
.chv{font-size:10px;color:var(--mf);transition:transform .2s}.chv.rot{transform:rotate(180deg)}
.cloud{padding:0 12px 12px}.cloudbtn{width:100%;display:flex;gap:8px;justify-content:center;align-items:center;padding:10px;border:0;border-radius:12px;font-size:12px;font-weight:600;background:rgba(0,113,227,.1);color:var(--pr)}
.ver{font-size:10px;color:var(--mf);text-align:center;margin:8px 0 0}
.foot3{padding:12px;border-top:1px solid var(--bd);background:var(--mu);display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.foot3 button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;border:0;border-radius:12px;background:none;color:inherit;font-size:12px;font-weight:500}.foot3 i{font-size:16px}.foot3 button:hover{background:var(--cd)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{min-height:64px;display:flex;gap:10px;align-items:center;padding:8px 16px;background:var(--gl);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--bd);flex-wrap:wrap}
.top h1{margin:0;font-size:18px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{flex:2;min-width:150px;max-width:320px}
.content{flex:1;overflow:auto;padding:16px}
.btn{border:0;border-radius:12px;height:38px;padding:0 16px;background:var(--pr);color:#fff;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:8px;box-shadow:0 1px 2px rgba(0,0,0,.08);transition:background .15s}
.btn:hover{background:var(--ph)}.btn.s{height:32px;font-size:12px;padding:0 12px}.btn.ok{background:var(--ok)}.btn.g{background:var(--mu);color:var(--mf);box-shadow:none}.btn.g:hover{background:var(--bd)}.btn.dg{background:#fee2e2;color:var(--dg)}.btn.wn{background:var(--wn)}
body.edit #em{background:var(--wn);color:#fff}body:not(.edit) .dg{display:none!important}
.card{background:var(--cd);border:1px solid rgba(210,210,215,.5);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}html.dark .card{border-color:var(--bd)}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.g3{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.split{display:grid;grid-template-columns:3fr 2fr;gap:12px}
.kpi b{font-size:26px;display:block}.kpi span{font-size:12px;color:var(--mf);font-weight:600}
h2{font-size:16px;margin:14px 0 8px}h3{margin:0 0 8px;font-size:15px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-block;background:var(--mu);color:var(--mf);border-radius:99px;padding:2px 8px;font-size:12px;font-weight:500}.pill.ok{background:#d1fae5;color:#047857}.pill.wn{background:#fef3c7;color:#92400e}
.it{background:var(--mu);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:8px;font-size:13px}.it.done{background:var(--ob);border-color:#a7f3d0}
.mu{color:var(--mf);font-size:12px}
.alert{background:#fef3c7;color:#78350f;border:1px solid #fcd34d;border-radius:12px;padding:12px;margin-bottom:12px;font-weight:600;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:right;padding:9px;border-bottom:1px solid var(--bd);vertical-align:top}th{background:var(--mu);color:var(--mf)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);overflow:auto;margin:10px 0}
.tab{border:0;background:none;padding:10px 12px;font-weight:600;font-size:13px;color:var(--mf);border-bottom:2px solid transparent;white-space:nowrap}.tab.on{color:var(--pr);border-color:var(--pr)}
input,select,textarea{border:1px solid rgba(210,210,215,.6);background:rgba(242,242,247,.5);color:var(--fg);border-radius:12px;padding:10px 14px;font-size:14px;width:100%}
html.dark input,html.dark select,html.dark textarea{background:rgba(44,44,46,.5);border-color:var(--bd)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pr)}textarea{min-height:70px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--mf)}
.form{display:grid;gap:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:14px;z-index:60}
.modal{background:var(--cd);width:min(560px,100%);max-height:90%;overflow:auto;border-radius:16px;padding:16px;box-shadow:0 25px 50px rgba(0,0,0,.25);border:1px solid var(--bd)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 16px;font-weight:600;z-index:70}
.hide{display:none!important}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{min-height:70px;border:1px solid var(--bd);border-radius:10px;padding:4px;font-size:11px}.day.t{border-color:var(--pr);background:var(--mu)}.day.e{border:0}
.ev{display:block;width:100%;margin-top:3px;border:0;border-radius:4px;background:var(--pr);color:#fff;font-size:10px;font-weight:600;padding:2px;text-align:right;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.ev.p{background:var(--mu);color:var(--mf)}
@media(max-width:900px){.g4{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr}.two{grid-template-columns:1fr}.top h1{font-size:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.side,.top,.btn,.tabs{display:none!important}.app,.content{display:block;overflow:visible}}
</style>
</head>
<body>
<div class="app">
<aside class="side" id="side" aria-label="תפריט ראשי">
 <div class="brandrow"><button class="brand" data-a="go" data-p="dashboard" aria-label="לדשבורד הראשי"><span class="logo"><i class="fa-solid fa-heart-pulse"></i></span><span><b>MedCentral</b><small>ניהול רפואי אישי</small></span></button><button class="icon" data-a="side" data-p="0" aria-label="סגור תפריט"><i class="fa-solid fa-xmark"></i></button></div>
 <nav id="nav"></nav>
 <div class="cloud"><button class="cloudbtn" data-a="gd"><i class="fa-solid fa-cloud"></i><span id="cl">התחבר לסנכרון (Google)</span></button><p class="ver">גרסה 1.0</p></div>
 <div class="foot3"><button data-a="dm"><i id="dmi" class="fa-solid fa-moon"></i><span id="dml">מצב כהה</span></button><button data-a="bk" style="color:var(--pr)"><i class="fa-solid fa-download"></i><span>גיבוי</span></button><button data-a="bk" style="color:var(--ok)"><i class="fa-solid fa-upload"></i><span>שחזור</span></button></div>
</aside>
<div id="scrim" class="scrim hide" data-a="side" data-p="0"></div>
<main class="main">
 <header class="top">
  <button class="icon" data-a="side" data-p="1" aria-label="פתח תפריט"><i class="fa-solid fa-bars"></i></button>
  <h1 id="title"></h1>
  <input id="q" class="search" type="search" placeholder="חיפוש תור, רופא, תרופה, מסמך…" aria-label="חיפוש">
  <button class="btn g" id="em" data-a="em"><i class="fa-solid fa-pen"></i> עריכה</button>
  <button class="btn" data-a="nt"><i class="fa-solid fa-plus"></i> תיק רפואי</button>
 </header>
 <div class="content" id="view"></div>
</main>
</div>
<div id="modal"></div><div id="toast" class="toast hide"></div>
<script>
const KEY="medcentral-html-v1",$=s=>document.querySelector(s),pad=n=>String(n).padStart(2,"0");
const KINDS={specialist:"רופא מומחה",family:"רופא משפחה",imaging:"מכון הדמיה (MRI, רנטגן, ממוגרפיה)",lab:"בדיקות דם"};
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>iso(new Date()),nowT=()=>{const d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())};
const pd=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const add=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const he=s=>s?pd(s).toLocaleDateString("he-IL"):"";
const heL=s=>s?pd(s).toLocaleDateString("he-IL",{day:"numeric",month:"long",year:"numeric"}):"";
const daysTo=d=>Math.round((pd(d)-pd(today()))/864e5);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const kind=k=>KINDS[k]||"תור / בדיקה";
const upc=(d,t)=>d>today()||(d===today()&&(t||"00:00")>=nowT());
const when=d=>{const n=daysTo(d);return n===0?"היום":n===1?"מחר":n>1?"בעוד "+n+" ימים":"לפני "+(-n)+" ימים"};
const uid=()=>Math.random().toString(36).slice(2,10);
const cyc=cs=>{const t=today();let fut=false;for(const c of cs||[]){if(c.start&&c.start>t){fut=true;continue}if(!c.end||c.end>=t)return{on:1,l:c.end?"פעיל · נותרו "+(daysTo(c.end)+1)+" ימים":"פעיל (ללא הגבלה)"}}return fut?{on:0,l:"טרם החל"}:{on:0,l:"הסבב הסתיים"}};
const D=",ד״ר ";
function seed(){return{view:"dashboard",tid:null,tab:"h",cal:null,filter:"all",taken:{},meds:[],vitals:[{id:"v1",type:"לחץ דם",value:"120/80",date:add(-5),time:"09:00"}],topics:[
{id:"knee",icon:"🦵",name:"כאבים ברגל ימין",appointments:[
{id:"k1",kind:"specialist",doctor:"ד״ר אברהם לוי (אורתופד)",date:add(5),time:"10:30",location:"מרפאת מומחים, נתניה",preparation:"להגיע בצום של 8 שעות ולהביא צילומים קודמים",summary:"",notes:"להכין שאלות על הכאב בהליכה",files:[]},
{id:"k2",kind:"lab",doctor:"מכון בדיקות דם",date:add(-40),time:"08:00",location:"",preparation:"צום של 8 שעות",summary:"מדדי הדלקת ירדו לנורמה.",notes:"",files:[{id:"f1",name:"תוצאות_בדיקות_דם.pdf",size:"1.2 MB"}]}],
prescriptions:[{id:"p1",name:"אתופן 400mg",dosage:"כדור אחד ביום לאחר אוכל",doctor:"ד״ר לוי",cycles:[{id:"c1",start:add(-10),end:add(14)}]}],docs:[],notes:[{id:"n1",date:add(-3),text:"נפיחות קלה באזור הברך בערב."}]},
{id:"eye",icon:"👁️",name:"מעקב עיניים",appointments:[{id:"e1",kind:"specialist",doctor:"ד״ר כהן (עיניים)",date:add(18),time:"11:00",location:"תל אביב",preparation:"להביא טופס 17 חתום",summary:"",notes:"",files:[]}],prescriptions:[{id:"p2",name:"טיפות הילו-קומוד",dosage:"3 פעמים ביום",doctor:"ד״ר כהן",cycles:[{id:"c2",start:add(-30),end:add(30)}]}],docs:[],notes:[]}]}}
let S=load();
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.topics)return Object.assign(seed(),r)}catch(e){}return seed()}
function save(){S.upd=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("לא ניתן לשמור: האחסון מלא או חסום")}window.drive&&drive.push()}
const T=id=>S.topics.find(t=>t.id===id);
let DB;const dbp=new Promise(r=>{try{const q=indexedDB.open("mc-files",1);q.onupgradeneeded=()=>q.result.createObjectStore("f");q.onsuccess=()=>{DB=q.result;r()};q.onerror=()=>r()}catch(e){r()}});
const fput=(id,b)=>new Promise(r=>{if(!DB)return r(0);try{const x=DB.transaction("f","readwrite");x.objectStore("f").put(b,id);x.oncomplete=()=>r(1);x.onerror=x.onabort=()=>r(0)}catch(e){r(0)}});
const fget=id=>new Promise(r=>{if(!DB)return r(null);try{const q=DB.transaction("f").objectStore("f").get(id);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)}catch(e){r(null)}});
const fdel=id=>{try{DB&&DB.transaction("f","readwrite").objectStore("f").delete(id)}catch(e){}};
async function keep(x){await dbp;const id=uid();if(!await fput(id,x))toast("תוכן הקובץ לא נשמר: אין מקום או שהאחסון חסום");return id}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.remove("hide");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add("hide"),2200)}
const B=(a,l,c,p,q)=>`<button class="btn ${c||""}" data-a="${a}" data-p="${esc(p??"")}" data-q="${esc(q??"")}">${l}</button>`;
const F=(l,id,v,t,ph)=>`<label class="f">${l}<input id="${id}" type="${t||"text"}" value="${esc(v)}" placeholder="${esc(ph)}"></label>`;
const V=id=>$("#"+id).value.trim();
const ups=()=>S.topics.flatMap(t=>t.appointments.filter(a=>upc(a.date,a.time)).map(a=>({t,a}))).sort((x,y)=>(x.a.date+x.a.time).localeCompare(y.a.date+y.a.time));
function docsOf(t){const m=new Map();t.appointments.forEach(a=>a.files.forEach(f=>m.set(f.name,{id:f.id,title:f.name,date:a.date,type:"מתוך בדיקה",src:a.doctor,topic:t.name,tid:t.id})));t.docs.forEach(d=>{if(!m.has(d.title))m.set(d.title,{...d,topic:t.name,tid:t.id})});return[...m.values()].sort((a,b)=>b.date.localeCompare(a.date))}
function medsToday(){const m=new Map();S.topics.forEach(t=>t.prescriptions.forEach(p=>{if(cyc(p.cycles).on&&!m.has(p.name))m.set(p.name,{name:p.name,dosage:p.dosage,topic:t.name})}));S.meds.forEach(p=>{if(!m.has(p.name))m.set(p.name,{...p,topic:"אישי"})});return[...m.values()].map(x=>({...x,taken:!!S.taken[today()+"|"+x.name]}))}
const empty=t=>`<p class="mu">${t}</p>`;
const apptCard=({t,a},full)=>`<div class="it"><div class="row"><div><span class="pill">${kind(a.kind)}</span> <span class="pill ${upc(a.date,a.time)&&daysTo(a.date)<=1?"wn":""}">${when(a.date)}</span><div><b>${full?esc(t.name)+" · ":""}${esc(a.doctor)}</b></div>${a.location?`<div class="mu">📍 ${esc(a.location)}</div>`:""}</div><b>${he(a.date)} · ${a.time||""}</b></div>${a.preparation?`<div class="mu" style="margin-top:6px">⚠️ הכנה: ${esc(a.preparation)}</div>`:""}<div style="margin-top:8px">${B("oa","פרטים / עריכה","s",t.id,a.id)}</div></div>`;
function dash(){const u=ups(),m=medsToday(),soon=u.filter(x=>daysTo(x.a.date)<=1),rx=S.topics.flatMap(t=>t.prescriptions.map(p=>({t,p,e:p.cycles.filter(c=>c.end&&c.end>=today()&&(!c.start||c.start<=today())).map(c=>c.end).sort().pop()}))).filter(x=>x.e&&daysTo(x.e)<=3);
const notes=S.topics.flatMap(t=>t.notes.map(n=>({...n,t}))).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4);
return(rx.length?`<div class="alert">💊 ${rx.map(x=>`${esc(x.p.name)} מסתיימת ${when(x.e)} — כדאי לחדש מרשם ${B("cy","+ סבב חדש","g s",x.t.id,x.p.id)}`).join("<br>")}</div>`:"")+(soon.length?`<div class="alert">🔔 ${soon.map(x=>`${when(x.a.date)} ${x.a.time}: ${esc(x.a.doctor)}${x.a.preparation?" — "+esc(x.a.preparation):""}`).join("<br>")}</div>`:"")+
`<div class="g4"><div class="card kpi"><span>תיקים רפואיים</span><b>${S.topics.length}</b></div><div class="card kpi"><span>תורים קרובים</span><b>${u.length}</b></div><div class="card kpi"><span>תרופות היום (נלקחו)</span><b>${m.filter(x=>x.taken).length}/${m.length}</b></div><div class="card kpi"><span>מדדים שנרשמו</span><b>${S.vitals.length}</b></div></div>
<div class="split"><div><div class="card"><div class="row"><h3>התורים הקרובים שלי</h3>${B("na","+ תור חדש","s")}</div>${u.map(x=>apptCard(x,1)).join("")||empty("אין תורים מתוכננים. לחצו על ״תור חדש״ כדי להוסיף.")}</div>
<div class="card"><h3>הפתקים האחרונים</h3>${notes.map(n=>`<div class="it"><b>${he(n.date)}</b> · ${esc(n.t.name)}<div>${esc(n.text)}</div></div>`).join("")||empty("אין פתקים")}</div></div>
